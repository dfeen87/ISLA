name: ALIVE Python Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-acceptance:
    name: ALIVE / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PortAudio on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install project, playback, and test dependencies
        run: python -m pip install -e '.[playback]' -r requirements.txt
      - name: Production-only acceptance (independent of research)
        run: python -m pytest -q tests --ignore-glob='tests/test_resonance02_*.py'
      - name: Complete acceptance including research (no research exclusions)
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests
