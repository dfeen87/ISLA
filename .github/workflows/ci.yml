name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Linux Strict Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ---------------------------------------------------------
      # JUCE Linux Dependencies
      # ---------------------------------------------------------
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxext-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libportaudio2 \
            libgtk-3-dev \
            webkit2gtk-4.0 \
            pkg-config

      # ---------------------------------------------------------
      # JUCE + pybind11 FETCH
      # ---------------------------------------------------------
      - name: Remove JUCE
        run: rm -rf drivers/JUCE

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git drivers/JUCE

      - name: Remove pybind11
        run: rm -rf drivers/pybind11

      - name: Clone pybind11
        run: git clone --depth 1 https://github.com/pybind/pybind11.git drivers/pybind11

      # ---------------------------------------------------------
      # CMake Build
      # ---------------------------------------------------------
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.24.x'

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS=VST3

      - name: Build
        run: cmake --build build --config Release

      # ---------------------------------------------------------
      # Python Test Environment
      # ---------------------------------------------------------
      - name: Install Python package
        run: pip install -e '.[playback]'

      - name: Add repo to PYTHONPATH
        run: echo "PYTHONPATH=$PWD:$PWD/drivers:$PYTHONPATH" >> $GITHUB_ENV

      - name: Production-only acceptance (independent of research)
        run: python -m pytest -q tests --ignore-glob='tests/test_resonance02_*.py'

      - name: Run complete Python tests (excluding pybind11 vendor tests)
        if: ${{ !cancelled() }}
        run: pytest -q --ignore=drivers/pybind11/tests

      # ---------------------------------------------------------
      # Upload Linux VST3 Artifact
      # ---------------------------------------------------------
      - name: Upload Linux VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISLA-linux-VST3
          path: build/ISLA_artefacts/VST3/ISLA.vst3
