name: Convert mislabeled ISLA screenshot to PNG once

on:
  push:
    branches:
      - docs/fix-isla-window-image
    paths:
      - .github/workflows/convert-isla-window-once.yml

permissions:
  contents: write

jobs:
  convert-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Convert the checked-in HEIF image with pillow-heif
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow pillow-heif
          python3 - <<'PY'
          from pathlib import Path
          from pillow_heif import register_heif_opener
          from PIL import Image

          source = Path("ISLA_Window.png")
          content = source.read_bytes()
          assert content[4:12] == b"ftypheix", "Expected HEIF source (despite .png extension)"
          register_heif_opener()
          with Image.open(source) as im:
              im.load()
              print("Decoded ISLA screenshot", im.format, im.size, im.mode)
              if im.width < 100 or im.height < 100:
                  raise ValueError("Screenshot dimensions too small")
              im.save("/tmp/ISLA_Window_converted.png", format="PNG")
          png = Path("/tmp/ISLA_Window_converted.png").read_bytes()
          assert png.startswith(b"\x89PNG\r\n\x1a\n"), "Expected PNG signature"
          print("Verified converted screenshot:", len(png), "PNG bytes")
          source.write_bytes(png)
          PY

      - name: Commit PNG and remove one-time conversion workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ISLA_Window.png
          git rm .github/workflows/convert-isla-window-once.yml
          git commit -m "fix(docs): replace mislabeled HEIF screenshot with real PNG"
          git push origin HEAD:docs/fix-isla-window-image
