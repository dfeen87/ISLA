name: Convert mislabeled ISLA screenshot to PNG once

on:
  push:
    branches:
      - docs/fix-isla-window-image
    paths:
      - .github/workflows/convert-isla-window-once.yml

permissions:
  contents: write

jobs:
  convert-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Inspect and convert checked-in HEIF to actual PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          content = Path("ISLA_Window.png").read_bytes()
          assert content[4:12] == b'ftypheix', "Expected mislabeled HEIF screenshot; inspect manually before overwriting"
          print("Confirmed HEIF bytes in the file named ISLA_Window.png")
          PY
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libheif-examples
          heif-convert ISLA_Window.png /tmp/isla-window-converted.png
          python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/isla-window-converted.png").read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', "Converter did not produce PNG"
          assert len(data) > 1000, "Converted image is unexpectedly small"
          print("PNG signature valid; length =", len(data))
          PY
          mv /tmp/isla-window-converted.png ISLA_Window.png

      - name: Commit PNG and remove temporary conversion workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ISLA_Window.png
          git rm .github/workflows/convert-isla-window-once.yml
          git diff --cached --quiet && { echo "No changes prepared"; exit 1; }
          git commit -m "fix(docs): replace HEIF masquerading as ISLA_Window.png with real PNG"
          git push origin HEAD:docs/fix-isla-window-image
